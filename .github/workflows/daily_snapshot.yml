# Refresh the public snapshot from Yahoo Finance. No API keys and no secrets.
# News, sentiment, profiles, and Prophet paths are carried forward by the script.
# A failed run does not commit, so data/latest and data/baseline stay as they were.

name: Daily public snapshot

on:
  schedule:
    # 15:00 UTC is after the 09:30 US cash open in both EST and EDT.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-public-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the demo repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public market-data libraries
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Refresh data/latest
        run: python scripts/refresh_snapshot.py

      - name: Commit the validated latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "Refresh public market snapshot [skip ci]"
          git push origin HEAD:main
